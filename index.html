<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Face Detection System</title>
<style>
    * { box-sizing: border-box; }
    body {
        font-family: 'Segoe UI', Arial, sans-serif;
        background: linear-gradient(135deg, #1f2937, #111827);
        color: #f3f4f6;
        margin: 0;
        padding: 40px 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
    }
    h1 {
        font-size: 2rem;
        margin-bottom: 5px;
    }
    p.subtitle {
        color: #9ca3af;
        margin-top: 0;
        margin-bottom: 30px;
    }
    .card {
        background: #1f2937;
        border: 1px solid #374151;
        border-radius: 14px;
        padding: 30px;
        width: 100%;
        max-width: 500px;
        text-align: center;
        box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    input[type="file"] {
        display: block;
        margin: 20px auto;
        color: #f3f4f6;
    }
    button {
        background: #22c55e;
        color: #062a12;
        border: none;
        padding: 12px 28px;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
    }
    button:hover { background: #16a34a; }
    .result {
        margin-top: 30px;
        text-align: center;
    }
    .result img {
        max-width: 100%;
        border-radius: 10px;
        border: 2px solid #374151;
        margin-top: 15px;
    }
    .badge {
        display: inline-block;
        background: #22c55e;
        color: #062a12;
        font-weight: 700;
        padding: 6px 16px;
        border-radius: 999px;
        margin-top: 10px;
    }
</style>
</head>
<body>

    <h1>🧑‍💻 Face Detection System</h1>
    <p class="subtitle">OpenCV + Haar Cascade se image me faces detect karo</p>

    <div class="card">
        <form method="POST" enctype="multipart/form-data">
            <input type="file" name="image" accept="image/*" required>
            <button type="submit">Detect Faces</button>
        </form>
    </div>

    {% if result_image %}
    <div class="result">
        <span class="badge">{{ face_count }} face(s) detected</span>
        <br>
        <img src="{{ result_image }}" alt="Detected faces">
    </div>
    {% endif %}

</body>
</html>
